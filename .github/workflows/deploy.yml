name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: /

  deploy:
    name: Deploy to server
    needs: build-frontend
    runs-on: ubuntu-latest
    # Repo secrets: HETZNER_HOST (server IP or hostname) and HETZNER_SSH_KEY
    # (private key whose public half is in ~deploy/.ssh/authorized_keys).
    steps:
      - name: Run deploy script over SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          # Free hosting (Render + Vercel) deploys from Git on its own; only
          # run this step once a Hetzner server has been configured.
          if [ -z "$HOST" ]; then
            echo "HETZNER_HOST not set; skipping VM deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy deploy@"$HOST" 'cd /opt/ai-tutor && ./deploy/deploy.sh'
