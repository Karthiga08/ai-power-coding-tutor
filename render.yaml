services:
  - type: web
    name: ai-tutor-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && alembic upgrade head
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-tutor-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://your-frontend-url.vercel.app"

  - type: pserv
    name: ai-tutor-db
    plan: free
    ipAllowList: []
    postgresMajorVersion: 15
